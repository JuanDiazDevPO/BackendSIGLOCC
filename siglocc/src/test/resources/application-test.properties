# H2 en memoria con compatibilidad MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=none: Hibernate no intenta crear ni validar tablas.
# Necesario porque las entidades @Immutable mapean vistas MySQL que no
# existen en H2. El test contextLoads no ejecuta queries, solo verifica
# que todos los beans se conecten correctamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Desactiva Spring Session JDBC en tests
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
spring.session.jdbc.initialize-schema=never
spring.sql.init.mode=never

# Mail — fallback a valores dummy si las variables de entorno no están
# disponibles en el CI. En ambos casos el test no envía correos reales,
# solo verifica que el bean JavaMailSender se cree correctamente.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:3025}
spring.mail.username=${MAIL_USERNAME:test@test.com}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.org.springframework.security=INFO

# Swagger
springdoc.swagger-ui.persistAuthorization=true

# JWT
jwt.secret=siglocc-super-secret-key-that-is-long-enough-for-hs256-algorithm!!
jwt.expiration=86400000

# URLs
app.frontend.url=http://localhost:4200
app.storage.path=uploads
